version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./lecture_index.joblib:/app/lecture_index.joblib
      - ./transcripts:/app/transcripts:ro
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      INDEX_PATH: /app/lecture_index.joblib
      RAG_ROOT: /app
    depends_on:
      - ollama
    networks:
      - rag-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - rag-network

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - rag-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  rag-network:
    driver: bridge

volumes:
  ollama_data:
